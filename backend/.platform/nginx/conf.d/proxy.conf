# Elastic Beanstalk puts nginx in front of the container. Its defaults are far
# too tight for this app, and both of these fail *before* the request ever
# reaches Go, so the app's own limits are irrelevant without them:
#
#   client_max_body_size  default 1m   -> any upload over 1 MB gets 413.
#                                         Gin is configured for 500 MB
#                                         (main.go: MaxMultipartMemory).
#   proxy_read_timeout    default 60s  -> OCR + AI endpoints (summarize,
#                                         complaint-reply, ...) routinely run
#                                         past 60s and would 504. The Go server
#                                         allows 300s (main.go: WriteTimeout).

client_max_body_size 500M;

proxy_connect_timeout 75s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
send_timeout          300s;

client_body_timeout   300s;
client_header_timeout 60s;

# Large uploads stream to a temp file instead of buffering in RAM.
client_body_buffer_size 1m;
